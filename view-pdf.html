<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض الشهادة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            background-color: #0f172a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 1rem 2rem;
            background: #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            background: #6366f1;
            color: #fff;
            text-decoration: none;
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            font-weight: bold;
        }

        .pdf-viewer {
            flex: 1;
            border: none;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="header">
        <h3>Document Viewer</h3>
        <a href="index.html" class="back-btn">← العودة للموقع</a>
    </div>
    <object data="assets/Sporton - Recommindation letter.pdf" type="application/pdf" class="pdf-viewer">
        <p>متصفحك لا يدعم عرض الـ PDF. <a href="assets/Sporton - Recommindation letter.pdf">اضغط هنا لتحميل الملف</a></p>
    </object>
</body>
</html>
